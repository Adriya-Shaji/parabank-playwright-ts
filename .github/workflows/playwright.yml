name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for ParaBank
        run: |
          for i in $(seq 1 30); do
            echo "Attempt $i: waiting for Parabank"
            if curl -sf http://localhost:8080/parabank/ > /dev/null; then
              echo "ParaBank is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Parabank is not ready after 150 seconds"
          exit 1

      - name: Run ParaBank tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
